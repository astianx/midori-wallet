name: Midori builds
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      android_release:
        description: Build signed Android APK and AAB (main only)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: midori-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  MIDORI_ALLOW_PUBLISH: 'false'
  MIDORI_SIGN_ARTIFACTS: 'false'
  MIDORI_BUILD_PROFILE: debug
  VITE_SITE_URL: https://midoriwallet.com/wallet/
  VITE_API_ORIGIN: https://midoriwallet.com
  VITE_WALLETCONNECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
  VITE_COMMIT: ${{ github.sha }}
  VITE_SENTRY_DSN: ${{ vars.SENTRY_FRONT_DSN }}
  VITE_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'production' }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_FRONT_PROJECT }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android-release: ${{ steps.policy.outputs.android-release }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Explain build and signing policy
        id: policy
        run: node scripts/ci/plan.mjs
        env:
          ANDROID_RELEASE_REQUESTED: ${{ inputs.android_release || false }}
  checks:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          target: checks
      - name: Reject retired dependency registries
        run: |
          if rg -i '@coinspace|npm.pkg.github.com|github.com/CoinSpace|"mongodb"' package-lock.json web/package-lock.json server/package-lock.json electron/package-lock.json phonegap/package-lock.json .npmrc web/.npmrc server/.npmrc; then exit 1; fi
      - run: npm run lint
      - run: npm run test:build
      - run: npm --prefix web run check:i18n
      - name: Prepare isolated PostgreSQL database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE midori_ci LOGIN PASSWORD 'midori-ci-local';"
          sudo -u postgres createdb -O midori_ci midori_verify_ci
          sudo -u postgres createdb -O midori_ci midori_verify_ci_tags
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "GRANT pg_signal_backend TO midori_ci;"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE midori_api LOGIN PASSWORD 'midori-api-ci-local';"
      - run: npm --prefix server test
        env:
          MIDORI_TEST_DATABASE_URL: postgresql://midori_ci:midori-ci-local@127.0.0.1/midori_verify_ci
          MIDORI_TEST_RUNTIME_DATABASE_URL: postgresql://midori_api:midori-api-ci-local@127.0.0.1/midori_verify_ci
          MIDORI_PG_ADMIN_URL: postgresql://midori_ci:midori-ci-local@127.0.0.1/postgres
          MIDORI_TAG_TEST_DATABASE_URL: postgresql://midori_ci:midori-ci-local@127.0.0.1/midori_verify_ci_tags
          MIDORI_TAG_TEST_RUNTIME_DATABASE_URL: postgresql://midori_api:midori-api-ci-local@127.0.0.1/midori_verify_ci_tags
      - run: npm --prefix server run contract:build
      - run: git diff --exit-code -- server/openapi.json
      - run: npm run build:web
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
      - run: node scripts/ci/artifacts.mjs web
      - uses: actions/upload-artifact@v4
        with:
          name: midori-web-${{ github.sha }}
          path: artifacts/web
          if-no-files-found: error
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          target: desktop
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot
      - run: npm run build:electron
        env:
          MIDORI_DESKTOP_ARCH: ${{ runner.os == 'macOS' && 'arm64' || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
      - name: Collect desktop artifacts and manifest
        if: ${{ !cancelled() }}
        run: node scripts/ci/artifacts.mjs desktop
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: midori-desktop-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/desktop
          if-no-files-found: error
  android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          target: mobile
      - uses: ./.github/actions/setup-android
      - run: npm run build:android
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
      - run: node scripts/ci/artifacts.mjs android
      - uses: actions/upload-artifact@v4
        with:
          name: midori-android-${{ github.sha }}
          path: artifacts/android
          if-no-files-found: error
  android-release:
    needs: [plan, android]
    if: needs.plan.outputs.android-release == 'true'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          target: mobile
      - uses: ./.github/actions/setup-android
      - name: Validate and decode Android signing configuration
        run: node scripts/ci/android-signing.mjs prepare
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build and verify signed APK and AAB
        run: |
          npm run build:android
          node scripts/ci/android-signing.mjs verify
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MIDORI_BUILD_PROFILE: release
          MIDORI_SIGN_ARTIFACTS: 'true'
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Remove signing files
        if: always()
        run: node scripts/ci/android-signing.mjs cleanup
      - name: Collect verified release artifacts and manifest
        run: node scripts/ci/artifacts.mjs android-release
      - uses: actions/upload-artifact@v4
        with:
          name: midori-android-release-${{ github.sha }}
          path: artifacts/android-release
          if-no-files-found: error
  ios:
    needs: checks
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          target: mobile
      - run: npm run build:ios
        env:
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
      - name: Preserve simulator bundle permissions
        run: |
          mkdir -p artifacts
          ios_bundle=$(find phonegap/build-native/debug/platforms/ios/build -type d -name '*.app' -print -quit)
          test -n "$ios_bundle"
          tar -czf artifacts/midori-ios-simulator.tar.gz -C "$(dirname "$ios_bundle")" "$(basename "$ios_bundle")"
      - run: node scripts/ci/artifacts.mjs ios
      - uses: actions/upload-artifact@v4
        with:
          name: midori-ios-simulator-${{ github.sha }}
          path: artifacts/ios
          if-no-files-found: error
