name: Midori builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: midori-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MIDORI_ALLOW_PUBLISH: 'false'
  MIDORI_SIGN_ARTIFACTS: 'false'
  MIDORI_BUILD_PROFILE: debug
  VITE_API_ORIGIN: https://wallet.astian.org
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            server/package-lock.json
            packages/wallet-core/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund --userconfig=/dev/null
      - run: npm --prefix packages/wallet-core ci --ignore-scripts --no-audit --no-fund --userconfig=/dev/null
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund --userconfig=/dev/null
      - run: npm --prefix server ci --ignore-scripts --no-audit --no-fund --userconfig=/dev/null
      - name: Reject retired dependency registries
        run: |
          if rg -i '@coinspace|npm.pkg.github.com|github.com/CoinSpace|"mongodb"' package-lock.json web/package-lock.json server/package-lock.json electron/package-lock.json phonegap/package-lock.json .npmrc web/.npmrc server/.npmrc; then exit 1; fi
      - run: npm run lint
      - name: Prepare isolated PostgreSQL database
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE midori_ci LOGIN PASSWORD 'midori-ci-local';"
          sudo -u postgres createdb -O midori_ci midori_verify_ci
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "GRANT pg_signal_backend TO midori_ci;"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE midori_api LOGIN PASSWORD 'midori-api-ci-local';"
      - run: npm --prefix server test
        env:
          MIDORI_TEST_DATABASE_URL: postgresql://midori_ci:midori-ci-local@127.0.0.1/midori_verify_ci
          MIDORI_TEST_RUNTIME_DATABASE_URL: postgresql://midori_api:midori-api-ci-local@127.0.0.1/midori_verify_ci
          MIDORI_PG_ADMIN_URL: postgresql://midori_ci:midori-ci-local@127.0.0.1/postgres
      - run: npm --prefix server run contract:build
      - run: git diff --exit-code -- server/openapi.json
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: midori-web-${{ github.sha }}
          path: |
            server/dist
            artifacts/*build.json
          if-no-files-found: error
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix packages/wallet-core ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix electron ci --ignore-scripts --no-audit --no-fund
      - run: node electron/node_modules/electron/install.js
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot
      - run: npm run build:electron
      - uses: actions/upload-artifact@v4
        with:
          name: midori-desktop-${{ matrix.os }}-${{ github.sha }}
          path: |
            electron/out/make
            artifacts/*build.json
          if-no-files-found: error
  android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix packages/wallet-core ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix phonegap ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: midori-android-${{ github.sha }}
          path: |
            phonegap/build-native/debug/platforms/android/app/build/outputs/apk/debug/*.apk
            artifacts/*build.json
          if-no-files-found: error
  ios:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix packages/wallet-core ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix phonegap ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:ios
      - name: Preserve simulator bundle permissions
        run: |
          mkdir -p artifacts
          ios_bundle=$(find phonegap/build-native/debug/platforms/ios/build -type d -name '*.app' -print -quit)
          test -n "$ios_bundle"
          tar -czf artifacts/midori-ios-simulator.tar.gz -C "$(dirname "$ios_bundle")" "$(basename "$ios_bundle")"
      - uses: actions/upload-artifact@v4
        with:
          name: midori-ios-simulator-${{ github.sha }}
          path: |
            artifacts/midori-ios-simulator.tar.gz
            artifacts/*build.json
          if-no-files-found: error
