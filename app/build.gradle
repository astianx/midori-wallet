plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStoreFile = System.getenv('MIDORI_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('MIDORI_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('MIDORI_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MIDORI_RELEASE_KEY_PASSWORD')
def releaseSigningValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def hasReleaseSigning = releaseSigningValues.every { it?.trim() }
// Optional smaller debug APK for a specific test device; release remains universal.
def debugAbi = project.findProperty('midoriDebugAbi')?.toString()
if (debugAbi && !(debugAbi in ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'])) {
    throw new GradleException('midoriDebugAbi must be arm64-v8a, armeabi-v7a, x86, or x86_64.')
}
if (releaseSigningValues.any { it?.trim() } && !hasReleaseSigning) {
    throw new GradleException('Set all four MIDORI_RELEASE_* variables to sign a release build.')
}

android {
    namespace 'org.astianx.midori.one'
    compileSdk 35

    defaultConfig {
        applicationId "org.astianx.midori.one"
        minSdk 33
        targetSdk 35
        versionCode 2
        versionName "0.1.0"
    }

    flavorDimensions 'network'
    productFlavors {
        mainnet {
            dimension 'network'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            midoriRelease {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-dev'
            if (debugAbi) {
                ndk { abiFilters debugAbi }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.midoriRelease
            }
        }
    }

    packagingOptions {
        jniLibs {
            // AGP 8.2.2 does not align uncompressed .so entries for 16 KB pages.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

dependencies {
    implementation project(':wdk-core-kotlin')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.json:json:20240303'

    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'com.google.zxing:core:3.5.3'
}
