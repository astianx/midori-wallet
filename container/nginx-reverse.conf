# midori-wallet — vhost de borde (midoriwallet.com). Escucha solo :80;
# certbot añade :443 y las directivas ssl.
#
# ANTES de instalar, confirmar que ningún otro vhost ya declara
# limit_req_status/limit_conn_status (se concatenan todos en el mismo
# bloque http) y que las zonas "wallet_*" no colisionan con otro vhost:
#   grep -l "limit_req_status\|zone=wallet_" /etc/nginx/vhosts.d/*.conf
#
# Instalar en /etc/nginx/vhosts.d/midori-wallet.conf, luego:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d midoriwallet.com --non-interactive --agree-tos -m <email>
# (requiere que el DNS de midoriwallet.com ya apunte a este servidor;
# la renovación la gestiona certbot-renew.timer, ya activo).
#
# El Pod publica la app en 127.0.0.1:2006 (ver container/setup.sh); no se
# expone directo a Internet, solo este borde lo alcanza. server.js sirve
# tanto la API (/api/v1/...) como la SPA (Vue) desde el mismo origen —no
# hace falta separar estáticos aquí, Express ya los sirve con cache-control
# e index.html de fallback.

limit_req_zone  $binary_remote_addr zone=wallet_public:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=wallet_api:10m    rate=50r/s;
limit_req_zone  $binary_remote_addr zone=wallet_auth:10m   rate=5r/s;
limit_conn_zone $binary_remote_addr zone=wallet_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name midoriwallet.com;

    server_tokens off;
    access_log /var/log/nginx/midori-wallet.access.log;
    error_log  /var/log/nginx/midori-wallet.error.log;

    # Un poco por encima del limite real de Express (1450kb, ver
    # server/app.js) para no enmascarar el 413 propio de la app con un 413
    # generico de nginx.
    client_max_body_size 2m;
    limit_conn wallet_conn 100;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # Defensa en profundidad (la app tambien bloquea dotfiles via su propio
    # express.static con dotfiles:'deny').
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:bak|conf|dist|dump|env|ini|log|orig|save|sh|sql|swp|tar)$ { deny all; }
    location ~ ~$ { deny all; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # CSP la define principalmente la propia app (server/app.js, por ruta);
    # no se duplica aqui para no pelear contra el 'self'/orígenes que ya
    # arma config.allowedOrigins dinámicamente.

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Única entrada confiable: se SOBRESCRIBE cualquier X-Forwarded-For del
    # cliente (evita spoofing de IP; la app usa remoteAddress para su propio
    # rate limit no autenticado, ver server/lib/auth.js limitUnauthenticated).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_redirect off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Registro, login, recuperación: límite agresivo (anti-fuerza bruta /
    # anti-enumeración). La app ya tiene su propio throttle:sync-unauth
    # equivalente (limitUnauthenticated); esto es defensa en profundidad.
    location ~* ^/api/v1/(registration|auth|recovery)/ {
        limit_req zone=wallet_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:2006;
    }

    location ^~ /api/ {
        limit_req zone=wallet_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:2006;
    }

    location / {
        limit_req zone=wallet_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:2006;
    }
}
# `certbot --nginx -d midoriwallet.com` reescribe este archivo: agrega el
# bloque :443 con los certificados y convierte este :80 en un redirect
# 301. No lo adelantes a mano; certbot necesita encontrar el "listen 80"
# tal cual para insertar el suyo correctamente.
