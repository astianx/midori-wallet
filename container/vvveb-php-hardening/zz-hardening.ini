; Security hardening (review 2026-11-14). Verified no code path in this
; vvveb install (app or vendor/) calls any of the disabled functions.
expose_php = Off
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,proc_close,pcntl_exec

; display_errors=STDOUT was printing raw PHP warnings/notices/uncaught
; exceptions (file paths, SQL, stack traces) straight into page responses
; seen by real visitors/admins (found 2026-11-15 via a user-reported wall
; of "Undefined array key" warnings leaking onto an admin page). log_errors
; was also Off, so those errors were never even recoverable afterwards.
; Now: never shown to the client, always captured in the existing
; storage/logs/error_log (already configured via `error_log` ini, unchanged).
display_errors = Off
log_errors = On
