pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "wdk-starter-kotlin"
include ':app'
include ':wdk-core-kotlin'
def wdkDirectory = file('vendor/wdk-core-kotlin')
if (!new File(wdkDirectory, 'build.gradle').isFile()) {
    throw new GradleException("WDK Kotlin module missing at ${wdkDirectory}. Run ./scripts/setup-wdk.sh first.")
}
project(':wdk-core-kotlin').projectDir = wdkDirectory
