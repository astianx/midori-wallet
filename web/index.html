<!DOCTYPE html>
<html lang="en" class="platform--<%= env.VITE_PLATFORM %>">
  <head>
    <title>Midori Wallet</title>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark"/>
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      connect-src
        'self'
        https://mainnet.base.org/
        <% if (NODE_ENV === 'development') { %>http://localhost:*/ http://127.0.0.1:*/ ws://localhost:*/ ws://127.0.0.1:*/<% } %>
        <%= env.VITE_SITE_URL %>
        <%= env.VITE_API_CSP %>
        <% if (['phonegap', 'electron'].includes(env.VITE_BUILD_TYPE)) { %>
        <%= env.VITE_SITE_URL_TOR %>
        <%= env.VITE_API_CSP_TOR %>
        <% } %>
;
      frame-src 'none';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
      img-src
        'self'
        blob:
        <% if (NODE_ENV === 'development') { %>http://localhost:*/ http://127.0.0.1:*/ ws://localhost:*/ ws://127.0.0.1:*/<% } %>
        <%= env.VITE_SITE_URL %>
        <%= env.VITE_API_CSP %>
        <% if (['phonegap', 'electron'].includes(env.VITE_BUILD_TYPE)) { %>
        <%= env.VITE_SITE_URL_TOR %>
        <%= env.VITE_API_CSP_TOR %>
        <% } %>
        
        data:;
    "/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Midori Wallet: USDT and USDC on Base, with local signing and portable recovery.">
    <meta name="format-detection" content="telephone=no"/>
    <meta name="format-detection" content="address=no"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000">
    <meta name="msapplication-TileColor" content="#262530">
    <meta name="theme-color" content="#262530">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Midori Wallet">
    <script src="/startup-0.js" defer></script>
    <style>
      @import '/src/assets/styles/common.scss';
    </style>
  </head>
  <body>
    <noscript>
      <div class="noscript">
        <div class="noscript__title">JavaScript is needed</div>
        <div class="noscript__message">Please enable it in your browser settings and refresh the page.</div>
      </div>
    </noscript>
    <div id="app"></div>
    <div id="error" class="error" style="display: none;">
      <div class="error__container">
        <div class="error__frame">
          <div class="error__logo-wrapper">
            <img class="error__logo" src="/src/assets/svg/logo.svg" loading="lazy">
          </div>
          <div class="error__error">
            <div class="error__title">Error</div>
            <div class="error__message">Update your browser or install Chrome on your device.</div>
          </div>
        </div>
        <div class="error__copyright"> © <%= new Date().getFullYear() %> AstianX, Inc </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script src="/startup-1.js" defer></script>
    <% if (env.VITE_BUILD_TYPE === 'phonegap') { %>
      <script src="cordova.js"></script>
    <% } %>
  </body>
</html>
